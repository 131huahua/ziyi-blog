<!-- ================= 17.0 黑夜极光/白天晨雾 双模顶栏 + Modal 播放器（保留我们的函数/结构） ================= -->
<style>
    /* 发丝音轨动画 */
    .stealth-eq-bar {
        width: 1.5px;
        border-radius: 1px;
        animation: stealthEq 1.2s ease-in-out infinite alternate;
    }
    .stealth-eq-bar:nth-child(1) { height: 5px; animation-delay: 0.1s; }
    .stealth-eq-bar:nth-child(2) { height: 10px; animation-delay: 0.3s; }
    .stealth-eq-bar:nth-child(3) { height: 7px; animation-delay: 0.2s; }

    @keyframes stealthEq {
        0%   { height: 3px; opacity: 0.4; }
        100% { height: 10px; opacity: 1; }
    }
    .paused .stealth-eq-bar {
        animation-play-state: paused;
        height: 3px !important;
        opacity: 0.3;
    }

    /* 歌词上下渐变淡出遮罩（双模） */
    .apple-lyric-mask {
        mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    }

    /* 高质感滑块（白天石板灰 / 黑夜半透白 + 翡翠拇指） */
    .stealth-range {
        -webkit-appearance: none;
        appearance: none;
        background: rgba(100, 116, 139, 0.2);
        border-radius: 9999px;
        outline: none;
    }
    .dark .stealth-range {
        background: rgba(255, 255, 255, 0.15);
    }
    .stealth-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #059669;
        cursor: pointer;
        transition: transform 0.15s ease;
    }
    .dark .stealth-range::-webkit-slider-thumb {
        background: #34d399;
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
    }
    .stealth-range::-webkit-slider-thumb:hover { transform: scale(1.3); }
</style>

            <p id="bigArtist" class="text-[11px] text-emerald-600 dark:text-emerald-400 font-mono font-medium mt-0.5">周杰伦</p>
        </div>

        <!-- 右：歌词 + 控制 -->

                <p class="text-xs text-slate-500/80 dark:text-white/35 font-light">歌词加载中…</p>
            </div>

                <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" class="stealth-range w-full h-1 cursor-pointer" oninput="seekAudio(this.value)">
                <div class="flex justify-between text-[10px] text-slate-500 dark:text-white/40 font-mono font-medium">
                    <span id="currentTimeText">00:00</span>
                    <span id="durationText">00:00</span>

            </div>
            <div class="flex items-center justify-between mt-2 pt-3 border-t border-slate-200/80 dark:border-white/10">
                <div class="flex items-center space-x-4">
                    <button onclick="prevTrack()" class="text-slate-600 hover:text-slate-900 dark:text-white/60 dark:hover:text-white active:scale-75 transition">

                    </button>
                    <button onclick="togglePlay(event)" id="bigPlayBtn" class="w-10 h-10 rounded-full bg-emerald-600 hover:bg-emerald-700 dark:bg-white dark:hover:bg-gray-200 text-white dark:text-black flex items-center justify-center shadow-md transition transform active:scale-90">

                    </button>
                    <button onclick="nextTrack()" class="text-slate-600 hover:text-slate-900 dark:text-white/60 dark:hover:text-white active:scale-75 transition">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <svg class="w-3.5 h-3.5 text-slate-500 dark:text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg>
                    <input type="range" id="bigVolume" min="0" max="1" step="0.05" value="0.5" class="stealth-range w-12 md:w-14 h-1 cursor-pointer" oninput="adjustVolume(this.value)">
                </div>
            </div>

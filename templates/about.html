{% extends "base.html" %}
{% block title %}关于 · ZIYI 的博客{% endblock %}
{% block content %}

<!-- 关于页 -->
<main class="relative bg-[#faf8f5] dark:bg-[#0b100d] pt-24 pb-24 px-6 md:px-12">
    <div class="max-w-2xl mx-auto">

        <!-- 版块标题 -->
        <div class="flex flex-col items-center mb-16">
            <span class="text-[10px] font-mono font-bold tracking-[0.3em] text-emerald-600 dark:text-emerald-400 uppercase block mb-2">About</span>
            <h3 class="text-3xl md:text-5xl font-bold text-slate-900 dark:text-white mb-3">关于我</h3>
            <div class="w-12 h-1 bg-emerald-600 mt-8 rounded-full"></div>
        </div>

        <!-- 头像 + 简介卡片 -->
        <div class="reveal" style="transition-delay:0s">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 md:p-12 shadow-lg border border-slate-200/80 minimal-card">
            <div class="flex flex-col items-center mb-10">
                <img src="{{ cfg('about_avatar') }}" alt="avatar"
                     class="w-28 h-28 rounded-full object-cover border-4 border-emerald-500/30 shadow-lg mb-6"
                     onerror="this.style.display='none'">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-1">{{ cfg('about_title') }}</h4>
                <p class="text-gray-400 text-sm mt-2 tracking-widest">PERSONAL BLOG · 个人博客</p>
            </div>

            <div class="article-content">
                {{ cfg('about_bio') | markdown | safe }}
            </div>

            <!-- 联系方式 -->
            <div class="border-t border-slate-200 mt-10 pt-8 flex justify-center space-x-10 text-sm">
                <a href="{{ cfg('github_url') }}" target="_blank" rel="noopener" class="text-slate-500 hover:text-emerald-700 transition">GITHUB ↗</a>
                <a href="#" class="text-slate-500 hover:text-emerald-700 transition">EMAIL ↗</a>
                <a href="#" class="text-slate-500 hover:text-emerald-700 transition">WEIBO ↗</a>
            </div>
        </div>
        </div>

    </div>
</main>

{% endblock %}
